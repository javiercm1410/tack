version: 2
project_name: tack
builds:
  - id: tack
    main: ./cmd/tack
    binary: tack
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - ids: [tack]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - LICENSE
      - README.md
      - skill/SKILL.md
      - docs/AUTHENTICATION.md
      - docs/IMPLEMENTATION.md
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:']
